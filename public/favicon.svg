<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="100" height="100" rx="24" fill="#090d16"/>
  <!-- Orbit 1 (Horizontal) -->
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="url(#orbitGrad)" stroke-width="2.5" fill="none"/>
  <!-- Orbit 2 (Tilted 60 deg) -->
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="url(#orbitGrad)" stroke-width="2.5" fill="none" transform="rotate(60 50 50)"/>
  <!-- Orbit 3 (Tilted -60 deg) -->
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="url(#orbitGrad)" stroke-width="2.5" fill="none" transform="rotate(-60 50 50)"/>
  <!-- Electrons -->
  <circle cx="88" cy="50" r="3.5" fill="#38bdf8"/>
  <circle cx="31" cy="17" r="3.5" fill="#a855f7"/>
  <circle cx="69" cy="83" r="3.5" fill="#6366f1"/>
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="10" fill="url(#nucleusGrad)"/>
  <circle cx="47" cy="47" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
